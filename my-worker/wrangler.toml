name = "my-worker"  # This can be any name for your worker
compatibility_date = "2024-09-23"  # Set this to today's date or whenever you deploy
main = "./src/index.ts"  # Points to your TypeScript entry file in the 'src' folder

[build]
command = "npm install"  # Use this to install dependencies, you can customize if needed

[[env]]
name = "dev"
workers_dev = true  # Will run the worker on workers.dev for local testing
route = ""  # No specific route for dev, leave empty
account_id = "3aefa2f7b2725c6cb66ee51308a568d821d3f"  # Replace with your actual Cloudflare account ID

[[env]]
name = "production"
workers_dev = false  # Disable workers.dev for production
route = "https://my-worker.alghost2004.workers.dev/*"  # Set to your domain or workers.dev URL
account_id = "3aefa2f7b2725c6cb66ee51308a568d821d3f"  # Replace with your actual Cloudflare account ID

